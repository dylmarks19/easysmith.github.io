<div class="wrap">
  <div class="sec-head">Get In <em>Touch</em></div>
  <p class="sec-sub" id="contact-sub"></p>

  <div class="contact-grid">
    <div class="contact-info" id="contact-left"></div>

    <form class="contact-form" id="enquiry-form">
      <div class="fgroup">
        <label class="flabel" for="enquiry-select">Enquiry Type</label>
        <select class="fselect" id="enquiry-select" name="enquiryType"></select>
      </div>

      <div class="fgroup fgroup-2">
        <div>
          <label class="flabel" for="product-category">Product Category</label>
          <select class="fselect" id="product-category" name="productCategory" onchange="updateProductModels()"></select>
        </div>
        <div>
          <label class="flabel" for="product-models">Model</label>
          <select class="fselect" id="product-models" name="model"></select>
        </div>
      </div>

      <div class="fgroup fgroup-2">
        <div>
          <label class="flabel" for="fname">Full Name</label>
          <input class="finput" type="text" id="fname" name="name" required>
        </div>
        <div>
          <label class="flabel" for="fcompany">Company (Optional)</label>
          <input class="finput" type="text" id="fcompany" name="company">
        </div>
      </div>

      <div class="fgroup fgroup-2">
        <div>
          <label class="flabel" for="femail">Email</label>
          <input class="finput" type="email" id="femail" name="email" required>
        </div>
        <div>
          <label class="flabel" for="fphone">Phone</label>
          <input class="finput" type="tel" id="fphone" name="phone">
        </div>
      </div>

      <div class="fgroup">
        <label class="flabel" for="fmessage">Message</label>
        <textarea class="ftarea" id="fmessage" name="message" rows="5" placeholder="Describe your requirements — model, quantity, delivery location, timeline, or any other details."></textarea>
      </div>

      <button class="btn btn-orange" type="submit" id="form-submit-btn"><i class="ti ti-send"></i> Submit Enquiry</button>
      <div class="form-msg" id="form-success"><i class="ti ti-circle-check"></i> Thank you — we'll be in touch within 2 business days.</div>
      <div class="form-msg" id="form-error"></div>
    </form>
  </div>

  <div id="lead-times-section"></div>
</div>

<footer><div class="footer-inner" id="footer"></div></footer>
